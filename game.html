<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wall Kicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #050507;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: none; /* Отключаем скролл */
            user-select: none;
            position: relative;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Холст под кнопками */
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 7, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10; /* Кнопки поверх холста */
            transition: opacity 0.3s;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .subtitle {
            color: #9a9aa3;
            font-size: 14px;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .btn {
            background: #ffffff;
            color: #050507;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 11;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .score-display {
            font-family: 'Courier New', monospace;
            font-size: 64px;
            font-weight: 800;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Экран старта -->
    <div class="overlay" id="start-screen">
        <div class="title">WALL KICKER</div>
        <div class="subtitle">// ТАПНИ, ЧТОБЫ ПРЫГНУТЬ</div>
        <button class="btn" id="startBtn">СТАРТ</button>
    </div>

    <!-- Экран проигрыша -->
    <div class="overlay hidden" id="game-over-screen">
        <div class="title" style="color: #ff4444; text-shadow: 0 0 20px rgba(255,68,68,0.5);">УПАЛ!</div>
        <div class="subtitle">// ТВОЙ РЕЗУЛЬТАТ</div>
        <div class="score-display" id="final-score">0</div>
        <button class="btn" id="restartBtn">ЕЩЕ РАЗ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Исправление размеров под экран телефона (Telegram WebApp)
        let width, height;
        function resize() {
            width = window.innerWidth;
            // tg.viewportHeight дает точную высоту без учета панелей Telegram
            height = tg.viewportHeight || window.innerHeight; 
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        const GRAVITY = 0.8;
        const JUMP_FORCE = -14;
        const SPEED_X = 6;
        const WALL_WIDTH = 20;
        const SLIDE_SPEED = 3;

        let player;
        let walls = [];
        let score = 0;
        let isPlaying = false;
        let isDead = false;

        function initPlayer() {
            player = {
                x: WALL_WIDTH,
                y: height - 100,
                w: 24,
                h: 24,
                vx: 0,
                vy: 0,
                isSliding: true,
                side: 'left'
            };
        }

        function initWalls() {
            walls = [];
            for (let i = 0; i < 10; i++) {
                walls.push({
                    y: height - 300 * i,
                    leftSpike: Math.random() > 0.5,
                    rightSpike: Math.random() > 0.5
                });
            }
        }

        // Управление прыжком
        function handleInput(e) {
            if (!isPlaying || isDead) return;
            if (e) e.preventDefault(); // Отменяем зум/скролл

            if (player.isSliding) {
                player.isSliding = false;
                player.vy = JUMP_FORCE;
                if (player.side === 'left') {
                    player.vx = SPEED_X;
                    player.side = 'right';
                } else {
                    player.vx = -SPEED_X;
                    player.side = 'left';
                }
            }
        }

        // Слушаем прыжок ТОЛЬКО на холсте, чтобы не мешать кнопкам
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        function update() {
            if (!isPlaying || isDead) return;

            if (!player.isSliding) {
                player.vy += GRAVITY;
            }

            player.x += player.vx;
            player.y += player.vy;

            // Левая стена
            if (player.x <= WALL_WIDTH) {
                player.x = WALL_WIDTH;
                player.isSliding = true;
                player.vx = 0;
                player.vy = SLIDE_SPEED;
                player.side = 'left';
            }
            
            // Правая стена
            if (player.x + player.w >= width - WALL_WIDTH) {
                player.x = width - WALL_WIDTH - player.w;
                player.isSliding = true;
                player.vx = 0;
                player.vy = SLIDE_SPEED;
                player.side = 'right';
            }

            if (player.isSliding) {
                player.y += player.vy;
            }

            // Проверка на падение
            if (player.y > height) {
                gameOver();
                return;
            }

            // Движение камеры вверх
            if (player.y < height / 2) {
                const diff = (height / 2) - player.y;
                player.y += diff;
                walls.forEach(wall => {
                    wall.y += diff;
                });
                score += Math.floor(diff);
            }

            // Генерация новых стен
            for (let i = 0; i < walls.length; i++) {
                if (walls[i].y > height + 100) {
                    let highestY = Math.min(...walls.map(w => w.y));
                    walls[i].y = highestY - 300;
                    walls[i].leftSpike = Math.random() > 0.5;
                    walls[i].rightSpike = Math.random() > 0.5;
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, width, height);

            // Стены
            ctx.fillStyle = '#1a1a1f';
            ctx.fillRect(0, 0, WALL_WIDTH, height);
            ctx.fillRect(width - WALL_WIDTH, 0, WALL_WIDTH, height);

            // Шипы
            ctx.fillStyle = '#ff4444';
            walls.forEach(wall => {
                if (wall.leftSpike) {
                    ctx.beginPath();
                    ctx.moveTo(WALL_WIDTH, wall.y + 20);
                    ctx.lineTo(WALL_WIDTH + 15, wall.y + 10);
                    ctx.lineTo(WALL_WIDTH, wall.y);
                    ctx.fill();
                }
                if (wall.rightSpike) {
                    ctx.beginPath();
                    ctx.moveTo(width - WALL_WIDTH, wall.y + 20);
                    ctx.lineTo(width - WALL_WIDTH - 15, wall.y + 10);
                    ctx.lineTo(width - WALL_WIDTH, wall.y);
                    ctx.fill();
                }
            });

            // Игрок
            if (player) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.shadowBlur = 0;
            }

            // Счет
            if (isPlaying && !isDead) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(score, width / 2, 60);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame(e) {
            if(e) e.preventDefault(); // Важно для мобилок
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            resize(); // Пересчитываем размеры на всякий случай
            score = 0;
            isPlaying = true;
            isDead = false;
            
            initPlayer();
            initWalls();
        }

        function gameOver() {
            isDead = true;
            isPlaying = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('error');
            }
        }

        // ЖЕСТКАЯ ПРИВЯЗКА КНОПОК (чтобы точно работали на телефоне)
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        startBtn.addEventListener('click', startGame);
        startBtn.addEventListener('touchstart', startGame, {passive: false});
        
        restartBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('touchstart', startGame, {passive: false});

        // Запуск
        gameLoop();
    </script>
</body>
</html>
