<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yorg.io Black & White</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden; background-color: #050507;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
      background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(10px);
      display: flex; justify-content: space-around; align-items: center; z-index: 10;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold;
      display: flex; flex-direction: column; align-items: center; cursor: pointer;
      font-family: 'Courier New', monospace; transition: 0.2s;
    }
    .btn.active { background: white; color: black; }
    .btn small { font-size: 10px; opacity: 0.8; margin-top: 4px; }
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; padding: 15px;
      background: rgba(20, 20, 25, 0.8); color: white;
      display: flex; justify-content: space-between; z-index: 10;
      font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div>🪙 <span id="gold">0</span></div>
    <div>⛓ <span id="iron">0</span></div>
    <div>🪨 <span id="stone">0</span></div>
    <div>🔫 <span id="ammo">0</span></div>
  </div>

  <div id="ui">
    <div class="btn" id="btn-mine" onclick="setBuild('mine')">⛏<small>Шахта</small></div>
    <div class="btn" id="btn-canon" onclick="setBuild('canon')">💣<small>Пушка</small></div>
    <div class="btn" id="btn-wall" onclick="setBuild('wall')">🧱<small>Стена</small></div>
    <div class="btn" onclick="setBuild(null)">✋<small>Отмена</small></div>
  </div>

  <script>
    // --- General Functions ---
    const grid = { x: 100, y: 75 }, w = 50;
    const oreNum = [
      { name: "gold", num: 50 },
      { name: "iron", num: 75 },
      { name: "stone", num: 80 },
    ];
    
    let materials = { gold: 2000, iron: 2000, stone: 2000 }; // Дадим ресурсов для старта
    let steel = 0;
    let ammo = 1000;
    const moneyReturn = 0.95;
    const dayLength = 17, nightLength = 7, hourLength = 1000;
    let towers = [], ores = [], base, zombies = [], selected;
    
    let buildType = null;
    let off = { x: 0, y: 0, zoom: 1 };
    let db = { x: false, y: false, xx: false, yy: false, times: 0 };

    function setBuild(type) {
      buildType = type;
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      if (type === 'mine') document.getElementById('btn-mine').classList.add('active');
      if (type === 'canon') document.getElementById('btn-canon').classList.add('active');
      if (type === 'wall') document.getElementById('btn-wall').classList.add('active');
    }

    function getGridPos(x, y) {
      return { x: floor((x - off.x) / (w * off.zoom)), y: floor((y - off.y) / (w * off.zoom)) };
    }

    function thePosIsNotUsed(gridPos, towers_arr = towers, ores_arr = ores) {
      if (base && base.pos.x == gridPos.x && base.pos.y == gridPos.y) return false;
      for (let tower of towers_arr) if (tower.pos.x == gridPos.x && tower.pos.y == gridPos.y) return false;
      for (let ore of ores_arr) if (ore.pos.x == gridPos.x && ore.pos.y == gridPos.y) return false;
      return true;
    }

    function getTowerAtPos(gridPos, towers_arr = towers) {
      if (base && base.pos.x == gridPos.x && base.pos.y == gridPos.y) return base;
      for (let tower of towers_arr) if (tower.pos.x == gridPos.x && tower.pos.y == gridPos.y) return tower;
    }

    function getAllTowersOfType(typeName) {
      if (typeName === "Base") return base;
      const out = [];
      for (let tower of towers) if (tower.constructor.name === typeName) out.push(tower);
      return out;
    }

    const sign = (x) => (x < 0 ? -1 : x === 0 ? 0 : 1);
    function distance(pos1, pos2) { return sqrt((pos1.x - pos2.x) ** 2 + (pos1.y - pos2.y) ** 2); }
    function getTime() { return (frameCount / hourLength) % (dayLength + nightLength); }
    function isDay() { return (frameCount / hourLength) % (dayLength + nightLength) < dayLength; }
    
    function spawnZombies(max_at_once = 2, chance = 50) {
      for (let i = 0; i < max_at_once; i++) if (floor(random(chance)) === 0) zombies.push(new Zombie());
    }
    function sortZombies() { zombies = zombies.sort((a, b) => sign(-base.distance(b.pos) + base.distance(a.pos))); }

    // --- Classes ---
    class Block {
      constructor(x, y) { this.pos = { x: x, y: y }; }
      show() {
        stroke(255); strokeWeight(1);
        circle(w * (this.pos.x + 0.5), w * (this.pos.y + 0.5), w * 0.5);
      }
      setProps(props) { for (let prop in props) this[prop] = props[prop]; }
      getRealPos() { return { x: (this.pos.x + 0.5) * w, y: (this.pos.y + 0.5) * w }; }
      distance(pos) { return distance(this.getRealPos(), pos); }
    }

    class Tower extends Block {
      static lvlColors = ["#ffffff", "#aaaaaa", "#555555"];
      static firstPrice = { gold: 10, iron: 0, stone: 0 };
      constructor(other = {}) {
        super(other.pos.x, other.pos.y);
        this.lvl = 0; this.health = 100; this.maxHealth = this.health;
        this.price = { gold: 0, iron: 0, stone: 0 };
        this.totalPrice = this.constructor.firstPrice;
        this.typeName = this.constructor.name;
        this.connectable = false; this.specialLevels = [];
        this.healSpeed = 150; this.healStrength = 15;
        this.setProps(other);
      }
      tryUpgrade(_materials = materials) {
        if (this === base || this.lvl < base.lvl) {
          for (let mat in this.price) if (this.price[mat] > _materials[mat]) return false;
          this.upgrade();
        }
      }
      upgrade(_materials = materials) {
        this.lvl++;
        this.health = round(this.health * 1.2);
        for (let mat in this.price) _materials[mat] -= this.price[mat];
        for (let mat in this.price) this.totalPrice[mat] += this.price[mat];
        for (let mat in this.price) this.price[mat] *= floor(2 ** sqrt(2 * this.lvl));
        this.localLvlColor = Tower.lvlColors[this.lvl % Tower.lvlColors.length];
        if (this.lvl === this.specialLevels[0]) { this.specialLevels.splice(0, 1); if (this.specialUpgrade) this.specialUpgrade(); }
      }
      static buyAble(_materials = materials) {
        for (let mat in this.prototype.constructor.firstPrice) if (this.prototype.constructor.firstPrice[mat] > _materials[mat]) return false;
        return true;
      }
      static buy(gridPos, _materials = materials, _towers = towers) {
        const currentTower = this.prototype.constructor;
        for (let mat in currentTower.firstPrice) _materials[mat] -= currentTower.firstPrice[mat];
        _towers.push(new currentTower({ pos: { x: gridPos.x, y: gridPos.y } }));
      }
      showConnections() {
        stroke(255); strokeWeight(15);
        for (let wall of getAllTowersOfType(this.typeName)) {
          if (wall !== this && this.isTowerNextToThis(wall)) {
            line((this.pos.x + 0.5) * w, (this.pos.y + 0.5) * w, (wall.pos.x + 0.5) * w, (wall.pos.y + 0.5) * w);
          }
        }
      }
      update() {
        if (this.health < this.maxHealth && frameCount % this.healSpeed === 0) {
          this.health += this.healStrength; if (this.health > this.maxHealth) this.health = this.maxHealth;
        }
        if (this.show) this.show();
      }
      sell(_materials = materials, _moneyReturn = moneyReturn) {
        for (let mat in _materials) _materials[mat] += this.totalPrice[mat] * _moneyReturn;
      }
      isTowerNextToThis(tower) {
        return sqrt((this.pos.x - tower.pos.x) ** 2 + (this.pos.y - tower.pos.y) ** 2) < 2;
      }
    }

    class Base extends Tower {
      constructor(other = {}) {
        super(other);
        this.health = 10000; this.maxHealth = 10000;
        this.price = { gold: 10000, iron: 10, stone: 10 };
        this.setProps(other);
      }
      show() {
        push(); strokeWeight(0.01); stroke(Tower.lvlColors[this.lvl % Tower.lvlColors.length]);
        translate(this.pos.x * w, this.pos.y * w); scale(w);
        fill(20); circle(0.5, 0.5, 0.75);
        fill(255); beginShape(); vertex(0.2, 0.1); vertex(0.5, 0.25); vertex(0.8, 0.1); vertex(0.9, 0.2); vertex(0.75, 0.5); vertex(0.9, 0.8); vertex(0.8, 0.9); vertex(0.5, 0.75); vertex(0.2, 0.9); vertex(0.1, 0.8); vertex(0.25, 0.5); vertex(0.1, 0.2); vertex(0.2, 0.1); endShape();
        line(0.2, 0.2, 0.5, 0.5); line(0.8, 0.2, 0.5, 0.5); line(0.2, 0.8, 0.5, 0.5); line(0.8, 0.8, 0.5, 0.5);
        stroke(0); strokeWeight(0.05); line(0.1, 0.5, 0.5, 0.5); line(0.9, 0.5, 0.5, 0.5); line(0.5, 0.1, 0.5, 0.5); line(0.5, 0.9, 0.5, 0.5);
        rectMode(CENTER); translate(0.5, 0.5); fill(255); square(0, 0, 0.3); rotate(PI / 4); fill(0); square(0, 0, 0.3); pop();
      }
    }

    class Wall extends Tower {
      constructor(other = {}) {
        super(other); this.health = 1000; this.connectable = true;
        this.price = { gold: 20, iron: 0, stone: 50 }; this.setProps(other);
      }
      show() {
        stroke(Tower.lvlColors[this.lvl % Tower.lvlColors.length]); strokeWeight(5);
        fill(Tower.lvlColors[(this.lvl + 1) % Tower.lvlColors.length]);
        circle((this.pos.x + 0.5) * w, (this.pos.y + 0.5) * w, w * 0.6);
        strokeWeight(1); stroke(0); circle((this.pos.x + 0.5) * w, (this.pos.y + 0.5) * w, w * 0.5);
      }
      upgrade() { super.upgrade(); this.health = floor(this.health * 1.15); }
    }

    class Canon extends Tower {
      constructor(other = {}) {
        super(other); this.price = { gold: 100, iron: 200, stone: 200 };
        this.reloadSpeed = 10; this.strength = 10; this.range = 100;
        this.heading = 0; this.bulletSpeed = 7; this.specialLevels = [3, 7, 10];
        this.bullets = []; this.setProps(other);
      }
      upgrade() { super.upgrade(); this.range *= 1.2; this.bulletSpeed *= 1.07; this.strength *= 1.25; }
      show() {
        push(); translate((this.pos.x + 0.5) * w, (this.pos.y + 0.5) * w); rotate(this.heading + PI / 2);
        stroke(0); strokeWeight(1);
        fill(255); rect(-0.25 * w, -0.5 * w, w * 0.5, 0.5 * w); fill(100); circle(0, 0, 0.6 * w); pop();
      }
      showRange() { fill(255, 10); noStroke(); circle((this.pos.x + 0.5) * w, (this.pos.y + 0.5) * w, this.range * 2); }
      updateBullets() { for (let b of this.bullets) b.update(); }
      update() {
        if (frameCount % this.reloadSpeed === 0) this.shoot();
        this.updateBullets(); this.showRange(); this.show();
      }
      shoot(_zombies = zombies) {
        if (ammo > 0) {
          const cannonPos = this.getRealPos();
          for (let zombie of _zombies) {
            const zDist = distance(cannonPos, zombie.pos);
            if (zDist <= this.range) {
              let heading = atan((zombie.pos.y - cannonPos.y) / (zombie.pos.x - cannonPos.x));
              heading = cannonPos.x <= zombie.pos.x ? heading - 2 * PI : heading - PI;
              this.heading = heading;
              this.bullets.push(new Bullet({
                pos: { x: (this.pos.x + 0.5) * w, y: (this.pos.y + 0.5) * w },
                heading: heading, strength: this.strength, speed: this.bulletSpeed,
                selfDestruct: (bullet) => this.bullets.splice(this.bullets.indexOf(bullet), 1),
              }));
              ammo--; return;
            }
          }
        }
      }
    }

    class Bullet {
      constructor(props) {
        this.pos = { x: 0, y: 0 }; this.heading = 0; this.strength = 0;
        this.size = 15; this.speed = 15; this.selfDestruct = null;
        this.lifespan = 0; this.maxLifeSpan = 500;
        for (let p in props) if (typeof props[p] !== "object") this[p] = props[p]; else this[p] = { ...props[p] };
      }
      show() { fill(255); stroke(0); strokeWeight(1); circle(this.pos.x, this.pos.y, this.size); }
      move() { this.pos.x += this.speed * cos(this.heading); this.pos.y += this.speed * sin(this.heading); }
      hit(_zombies = zombies) {
        for (let z of _zombies) {
          if (distance(this.pos, z.pos) <= this.size / 2) {
            z.health -= this.strength;
            if (z.health <= 0) { materials.gold += z.reward; _zombies.splice(_zombies.indexOf(z), 1); }
            if (this.selfDestruct) this.selfDestruct(this);
            return;
          }
        }
      }
      update() {
        this.show(); this.move(); this.hit();
        this.lifespan++;
        if (this.lifespan > this.maxLifeSpan && this.selfDestruct) this.selfDestruct(this);
      }
    }

    class Mine extends Tower {
      static firstPrice = { gold: 10, iron: 15, stone: 20 };
      static basicHarvestSizes = { gold: 3, iron: 4, stone: 5 };
      static mineSpeed = 60;
      constructor(other = {}) {
        super(other); this.price = { gold: 20, iron: 10, stone: 15 };
        this.connected = []; this.harvestSize = 1;
        for (let ore of ores) if (sqrt((ore.pos.x - this.pos.x) ** 2 + (ore.pos.y - this.pos.y) ** 2) === 1) this.connected.push(ore);
        this.setProps(other);
      }
      show(t = frameCount, max = 50) {
        super.show();
        push(); rectMode(CENTER); stroke(Tower.lvlColors[this.lvl % Tower.lvlColors.length]); strokeWeight(2.5);
        for (let ore of this.connected) {
          fill(ore.getTypeColor()); line(w * (this.pos.x + 0.5), w * (this.pos.y + 0.5), w * (ore.pos.x + 0.5), w * (ore.pos.y + 0.5));
          strokeWeight(0.2);
          circle(w * (ore.pos.x + 0.5) + (w * ((t + Mine.mineSpeed) % Mine.mineSpeed) * (this.pos.x - ore.pos.x)) / Mine.mineSpeed,
                 w * (ore.pos.y + 0.5) + (w * ((t + Mine.mineSpeed) % Mine.mineSpeed) * (this.pos.y - ore.pos.y)) / Mine.mineSpeed, 10);
        }
        fill(50); strokeWeight(0.25); translate(w * (this.pos.x + 0.5), w * (this.pos.y + 0.5));
        square(0, 0, w * 0.5); rotate(PI / 4); square(0, 0, w * 0.5); noStroke(); rotate(-PI / 4); square(0, 0, w * 0.48);
        stroke(255); strokeWeight(1.75); line((-1.25 * w) / 8, (1.25 * w) / 8, w / 10, -w / 10);
        stroke(Tower.lvlColors[this.lvl % Tower.lvlColors.length]); noFill(); beginShape();
        vertex(-w / 9, -w / 8.5); vertex(w / 9, -w / 9); vertex(w / 8.5, w / 9); endShape(); pop();
      }
      harvest(_materials = materials) {
        for (let ore of this.connected) _materials[ore.type] += this.harvestSize * Mine.basicHarvestSizes[ore.type];
      }
      upgrade() { super.upgrade(); this.harvestSize *= 2; }
      static harvest(_materials = materials) { for (let mine of getAllTowersOfType("Mine")) mine.harvest(_materials); }
      static tryHarvest(_materials = materials) { if (frameCount % Mine.mineSpeed === 0) Mine.harvest(_materials); }
    }

    class Zombie {
      constructor(props) {
        const randNum = floor(random() * 4);
        this.pos = randNum === 0 ? { x: floor(random(grid.x * w)), y: 0 }
          : randNum === 1 ? { x: grid.x * w, y: floor(random(grid.y * w)) }
          : randNum === 2 ? { x: floor(random(grid.x * w)), y: grid.y * w }
          : { x: 0, y: floor(random(grid.y * w)) };
        this.health = 100; this.maxHealth = this.health; this.demage = 40;
        this.attackSpeed = 50; this.speed = 5; this.r = 17.5;
        this.lifespan = 5000; this.timeLiving = 0; this.reward = 10;
        for (let prop in props) this[prop] = props[prop];
      }
      update() {
        this.timeLiving++;
        if (this.timeLiving >= this.lifespan) zombies.splice(zombies.indexOf(this), 1);
        if (this.isTouchingTower()) this.attack(); else this.move();
        this.show();
      }
      show() {
        stroke(255); strokeWeight(1); fill(0); circle(this.pos.x, this.pos.y, this.r);
        strokeWeight(3); stroke(255);
        line(this.pos.x - 10, this.pos.y + 15, this.pos.x - 10 + (20 * this.health) / this.maxHealth, this.pos.y + 15);
      }
      move(target = base) {
        if (target && !this.isTouchingTower()) {
          const dx = target.getRealPos().x - this.pos.x;
          const dy = target.getRealPos().y - this.pos.y;
          this.pos.x += this.speed * (dx / max(abs(dx), abs(dy))) || 0;
          this.pos.y += this.speed * (dy / max(abs(dx), abs(dy))) || 0;
        }
      }
      attack(tower) {
        if (frameCount % this.attackSpeed === 0) {
          tower = tower || this.getTouchingTowers();
          tower.health -= this.demage;
          if (tower.health < 0) {
            if (tower !== base) { if (tower === selected) selected = undefined; towers.splice(towers.indexOf(tower), 1); }
            else { base.health = 0; noLoop(); alert("База уничтожена!"); }
          }
        }
      }
      isTouchingTower(_towers = towers, _base = base) {
        for (let t of _base ? [..._towers, base] : [..._towers]) {
          if (sqrt((this.pos.x - t.getRealPos().x) ** 2 + (this.pos.y - t.getRealPos().y) ** 2) < w / 2 + this.r) return true;
        }
        return false;
      }
      getTouchingTowers(_towers = towers, _base = base) {
        for (let t of _base ? [..._towers, base] : [..._towers]) {
          if (sqrt((this.pos.x - t.getRealPos().x) ** 2 + (this.pos.y - t.getRealPos().y) ** 2) < w / 2 + this.r) return t;
        }
      }
    }

    class Ore extends Block {
      constructor(props) { super(props.pos.x, props.pos.y); this.type = "gold"; for (let p in props) this[p] = props[p]; }
      show() {
        push(); strokeWeight(0.75); translate(w * (this.pos.x + 0.5), w * (this.pos.y + 0.5));
        noStroke(); rectMode(CENTER); fill(255); circle(0, 0, w * 0.65); square(0, 0, w * 0.55);
        fill(this.getTypeColor()); rotate(PI / 5); square(0, 0, w * 0.5); rotate(PI / 3); square(0, 0, w * 0.475);
        fill(255); rotate((2 * PI) / 5); rect(0, 0, w * 0.425); circle(0, 0, w * 0.475); pop();
      }
      getTypeColor() {
        if (this.type === "gold") return "#ffffff";
        else if (this.type === "iron") return "#aaaaaa";
        else if (this.type === "stone") return "#555555";
      }
    }

    // --- Main sketch ---
    function setup() {
      createCanvas(windowWidth, windowHeight);
      document.oncontextmenu = () => false;
      
      // Spawn base in the center
      base = new Base({ pos: { x: floor(grid.x/2), y: floor(grid.y/2) } });

      for (let o of oreNum) {
        for (let i = 0; i < o.num; i++) {
          let x, y;
          do { x = floor(random(grid.x)); y = floor(random(grid.y)); } while (!thePosIsNotUsed({ x: x, y: y }));
          ores.push(new Ore({ pos: { x: x, y: y }, type: o.name }));
        }
      }
    }

    function draw() {
      background(5);

      push();
      translate(off.x, off.y);
      scale(off.zoom);

      // Draw grid subtly
      stroke(255, 10); strokeWeight(1);
      for(let i=0; i<grid.x; i++) line(i*w, 0, i*w, grid.y*w);
      for(let i=0; i<grid.y; i++) line(0, i*w, grid.x*w, i*w);

      if (!isDay() && (getTime() - dayLength) / nightLength <= 0.75) spawnZombies();
      if (base) sortZombies();

      for (let tower of towers) if (tower.connectable) tower.showConnections();
      for (let tower of towers) tower.update ? tower.update() : tower.show();
      for (let ore of ores) ore.show();
      if (base) base.update();
      for (let zombie of zombies) zombie.update();

      pop();

      // Night overlay
      if(!isDay()) {
        fill(0, 0, 0, 150);
        rect(0, 0, width, height);
      }

      Mine.tryHarvest();

      // Update HUD
      document.getElementById('gold').innerText = floor(materials.gold);
      document.getElementById('iron').innerText = floor(materials.iron);
      document.getElementById('stone').innerText = floor(materials.stone);
      document.getElementById('ammo').innerText = ammo;
    }

    // --- Input ---
    function mousePressed() {
      db = { x: mouseX, y: mouseY, xx: mouseX, yy: mouseY, times: 0 };
    }

    function mouseReleased(e) {
      // Check if tapped on UI (bottom 80px)
      if (mouseY > height - 80 || mouseY < 60) return;

      if (db.times < 10 && sqrt((mouseX - db.xx) ** 2 + (mouseY - db.yy) ** 2) < 25) {
        const gridPos = getGridPos(mouseX, mouseY);
        if (thePosIsNotUsed(gridPos)) {
          // Build
          if (buildType === 'mine' && Mine.buyAble()) Mine.buy(gridPos);
          if (buildType === 'canon' && Canon.buyAble()) Canon.buy(gridPos);
          if (buildType === 'wall' && Wall.buyAble()) Wall.buy(gridPos);
        } else {
          // Select
          selected = getTowerAtPos(gridPos);
          // Если нажали на башню, попробуем ее улучшить (упрощенно)
          if(selected && selected !== base) {
            selected.tryUpgrade();
          }
        }
      }
      db = { x: false, y: false, xx: false, yy: false, times: 0 };
    }

    function mouseWheel(event) {
      if (event.delta < 0) { if (off.zoom < 3) off.zoom *= 1.15; }
      else if (off.zoom >= 0.3) off.zoom /= 1.15;
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
