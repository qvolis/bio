<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wall Hopper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050507;color:#ffffff;
font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;touch-action:manipulation}
canvas{display:block;width:100vw;height:100vh}

#hud{position:fixed;top:15px;left:15px;right:15px;
display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.panel{background:rgba(255, 255, 255, 0.04);padding:12px 16px;border-radius:12px;
border:1px solid rgba(255, 255, 255, 0.08);font-family:'Courier New',monospace;
font-size:16px;font-weight:700;color:#ffffff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

#menu{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;background:rgba(5, 5, 7, 0.85);backdrop-filter:blur(5px);z-index:20}
.card{text-align:center;background:rgba(255, 255, 255, 0.03);padding:40px 30px;
border-radius:16px;width:min(90%,400px);border:1px solid rgba(255, 255, 255, 0.08);box-shadow:0 10px 40px rgba(0,0,0,0.5)}
h1{font-size:36px;margin:0 0 15px;font-weight:800;letter-spacing:-1px}
h1 span{color:#9a9aa3}
p{line-height:1.5;color:#9a9aa3;font-size:14px;margin-bottom:20px}
button{padding:16px 25px;border:0;border-radius:12px;
background:#ffffff;color:#050507;font-size:16px;
font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:transform 0.1s}
button:active{transform:scale(0.95)}
#help{position:fixed;bottom:15px;width:100%;text-align:center;
font-size:12px;color:#6b6b73;pointer-events:none;font-family:'Courier New',monospace;letter-spacing:1px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel">⬆ <span id="height">0</span> м</div>
 <div class="panel">🪙 <span id="coins">0</span></div>
</div>

<div id="help">← → или тап по экрану</div>

<div id="menu">
 <div class="card">
  <h1>WALL <span>HOPPER</span></h1>
  <p>Прыгай с одной стены на другую, собирай монеты
  и заберись как можно выше!</p>
  <button id="start">НАЧАТЬ ИГРУ</button>
 </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,player,steps,coins,score,camera,state;
let best=0,frame=0;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function reset(){
 player={
  x:40,y:H-120,vx:0,vy:0,
  side:-1,attached:true
 };
 steps=[];
 coins=[];
 score=0;
 camera=0;
 frame=0;

 for(let i=0;i<20;i++)makeStep(H-30-i*110);

 state="playing";
 document.getElementById("menu").style.display="none";
}

function makeStep(y){
 const side=Math.random()<0.5?-1:1;
 steps.push({
  x:side===-1?0:W-75,
  y:y,w:75,h:12,side
 });

 if(Math.random()<0.7){
  coins.push({
   x:W*0.2+Math.random()*W*0.6,
   y:y-45,taken:false
  });
 }
}

function jump(dir){
 if(state!=="playing")return;

 player.side=dir;
 player.vx=dir*5.2;
 player.vy=-9.2;
 player.attached=false;
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
  jump(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
  jump(1);
 if(e.code==="Space"&&state!=="playing")reset();
});

canvas.addEventListener("pointerdown",e=>{
 jump(e.clientX<W/2?-1:1);
});

document.getElementById("start").onclick=reset;

function gameOver(){
 state="over";
 best=Math.max(best,Math.floor((H-player.y+camera)/10));

 document.getElementById("menu").style.display="flex";
 document.querySelector(".card").innerHTML=`
 <h1 style="color:#ffffff">ИГРА <span style="color:#ff4444">ОКОНЧЕНА</span></h1>
 <p style="color:#9a9aa3">Высота: <b style="color:#fff">${Math.max(0,Math.floor((H-player.y+camera)/10))} м</b></p>
 <p style="color:#9a9aa3">Монет собрано: <b style="color:#fff">${score}</b></p>
 <p style="color:#9a9aa3">Рекорд: <b style="color:#fff">${best} м</b></p>
 <button onclick="reset()">ИГРАТЬ СНОВА</button>`;
 
 if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
}

function update(){
 if(state!=="playing")return;
 frame++;

 if(!player.attached){
  player.vy+=0.3;
  player.x+=player.vx;
  player.y+=player.vy;
  player.vx*=0.995;

  // Приземление на противоположную стену
  if(player.side===-1&&player.x<32){
   player.x=32;
   player.vx=0;
   player.vy=0;
   player.attached=true;
  }

  if(player.side===1&&player.x>W-32){
   player.x=W-32;
   player.vx=0;
   player.vy=0;
   player.attached=true;
  }
 }

 // Камера следует за игроком вверх
 const target=player.y-H*0.45;
 if(target<camera)camera+=(target-camera)*0.1;

 // Создание новых платформ
 let highest=Math.min(...steps.map(s=>s.y));
 while(highest>camera-200){
  highest-=110;
  makeStep(highest);
 }

 steps=steps.filter(s=>s.y<camera+H+100);
 coins=coins.filter(c=>c.y<camera+H+100);

 // Сбор монет
 for(const c of coins){
  if(!c.taken&&Math.hypot(player.x-c.x,player.y-c.y)<25){
   c.taken=true;
   score++;
  }
 }

 document.getElementById("coins").textContent=score;
 document.getElementById("height").textContent=
  Math.max(0,Math.floor((H-player.y+camera)/10));

 // Проигрыш при падении
 if(player.y-camera>H+40)gameOver();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 // Фон (черный)
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,"#050507");
 bg.addColorStop(1,"#0a0a0d");
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 // Звёзды (белые точки)
 ctx.fillStyle="rgba(255, 255, 255, 0.15)";
 for(let i=0;i<45;i++){
  const x=(i*137)%W;
  const y=((i*83-camera*0.2)%H+H)%H;
  ctx.fillRect(x,y,2,2);
 }

 // Стены (темно-серые)
 ctx.fillStyle="#1a1a1f";
 ctx.fillRect(0,0,16,H);
 ctx.fillRect(W-16,0,16,H);

 // Платформы
 for(const s of steps){
  const y=s.y-camera;
  if(y<-20||y>H+20)continue;

  ctx.fillStyle="#2c2c2e";
  ctx.fillRect(s.x,y,s.w,s.h);

  // Белая полоска сверху платформы
  ctx.fillStyle="#ffffff";
  ctx.fillRect(s.x,y,s.w,2);
 }

 // Монеты (белые)
 for(const c of coins){
  if(c.taken)continue;
  const y=c.y-camera;
  if(y<-20||y>H+20)continue;

  ctx.beginPath();
  ctx.arc(c.x,y,7,0,Math.PI*2);
  ctx.fillStyle="#ffffff";
  ctx.fill();

  ctx.strokeStyle="#9a9aa3";
  ctx.lineWidth=2;
  ctx.stroke();
 }

 // Персонаж
 const x=player.x,y=player.y-camera;

 // Ноги (серые)
 ctx.strokeStyle="#6b6b73";
 ctx.lineWidth=6;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(x-4,y+7);
 ctx.lineTo(x-9,y+16);
 ctx.moveTo(x+4,y+7);
 ctx.lineTo(x+9,y+16);
 ctx.stroke();

 // Тело (белое)
 ctx.fillStyle="#ffffff";
 ctx.beginPath();
 ctx.roundRect(x-10,y-8,20,22,6);
 ctx.fill();

 // Голова (светло-серая)
 ctx.fillStyle="#e0e0e0";
 ctx.beginPath();
 ctx.arc(x,y-15,10,0,Math.PI*2);
 ctx.fill();

 // Волосы (темные)
 ctx.fillStyle="#2a2a30";
 ctx.beginPath();
 ctx.arc(x,y-18,10,Math.PI,Math.PI*2);
 ctx.fill();

 // Глаз (черный)
 ctx.fillStyle="#050507";
 ctx.fillRect(x+(player.side===-1?-5:2),y-15,3,2);

 // Шарф (серый)
 ctx.fillStyle="#9a9aa3";
 ctx.beginPath();
 ctx.moveTo(x-5,y-5);
 ctx.lineTo(x-17,y);
 ctx.lineTo(x-10,y+4);
 ctx.fill();
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
