<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Platform Jumper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #050507;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            position: relative;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 7, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .subtitle {
            color: #9a9aa3;
            font-size: 14px;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .btn {
            background: #ffffff;
            color: #050507;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 11;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        .btn:active { transform: scale(0.95); }
        .score-display {
            font-family: 'Courier New', monospace;
            font-size: 64px;
            font-weight: 800;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Экран старта -->
    <div class="overlay" id="start-screen">
        <div class="title">PLATFORM JUMPER</div>
        <div class="subtitle">// ТАПАЙ, ЧТОБЫ ПРЫГАТЬ</div>
        <button class="btn" id="startBtn">СТАРТ</button>
    </div>

    <!-- Экран проигрыша -->
    <div class="overlay hidden" id="game-over-screen">
        <div class="title" style="color: #ff4444; text-shadow: 0 0 20px rgba(255,68,68,0.5);">УПАЛ!</div>
        <div class="subtitle">// ТВОЙ РЕЗУЛЬТАТ</div>
        <div class="score-display" id="final-score">0</div>
        <button class="btn" id="restartBtn">ЕЩЕ РАЗ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = tg.viewportHeight || window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Настройки физики
        const GRAVITY = 0.6;
        const JUMP_FORCE = -13;
        const MOVE_SPEED = 4;
        
        let player;
        let platforms = [];
        let score = 0;
        let isPlaying = false;
        let isDead = false;
        let cameraY = 0;

        function initPlayer() {
            player = {
                x: width / 2 - 15,
                y: height - 150, // Спавн на земле
                w: 30,
                h: 30,
                vx: MOVE_SPEED, // Автоматическое движение
                vy: 0,
                onGround: true
            };
        }

        function initPlatforms() {
            platforms = [];
            // Земля
            platforms.push({ x: 0, y: height - 60, w: width, h: 60, isGround: true });
            
            // Первые платформы
            let lastY = height - 200;
            for (let i = 0; i < 15; i++) {
                let pW = 80 + Math.random() * 60;
                let pX = Math.random() * (width - pW);
                platforms.push({ x: pX, y: lastY, w: pW, h: 15 });
                lastY -= 100 + Math.random() * 60;
            }
        }

        // Управление прыжком (только тап)
        function handleInput(e) {
            if (!isPlaying || isDead) return;
            if (e) e.preventDefault();
            
            // Прыгаем только если стоим на земле/платформе
            if (player.onGround) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        function update() {
            if (!isPlaying || isDead) return;

            // Физика
            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            // Отскок от стен экрана
            if (player.x <= 0) {
                player.x = 0;
                player.vx *= -1;
            } else if (player.x + player.w >= width) {
                player.x = width - player.w;
                player.vx *= -1;
            }

            // Проверка коллизий с платформами
            player.onGround = false;
            for (let p of platforms) {
                // Проверяем, приземлился ли игрок (падает вниз и касается платформы)
                if (player.vy > 0 && 
                    player.y + player.h > p.y && 
                    player.y + player.h - player.vy <= p.y + 10 && // Не проваливаемся сквозь
                    player.x + player.w > p.x && 
                    player.x < p.x + p.w) {
                    
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            // Камера следует за игроком вверх
            if (player.y < height / 2) {
                let diff = height / 2 - player.y;
                player.y += diff;
                for (let p of platforms) {
                    p.y += diff;
                }
                score += Math.floor(diff / 10);
            }

            // Удаляем ушедшие вниз платформы и создаем новые сверху
            let highestY = Math.min(...platforms.map(p => p.y));
            if (highestY > cameraY - height) {
                let pW = 80 + Math.random() * 60;
                let pX = Math.random() * (width - pW);
                platforms.push({ x: pX, y: highestY - 100 - Math.random() * 60, w: pW, h: 15 });
            }
            platforms = platforms.filter(p => p.y < height + 200 || p.isGround);

            // Проверка на падение
            if (player.y > height + 50) {
                gameOver();
            }
        }

        function draw() {
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, width, height);

            // Платформы
            platforms.forEach(p => {
                if (p.isGround) {
                    ctx.fillStyle = '#1a1a1f';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }
            });

            // Игрок
            if (player) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.shadowBlur = 0;
            }

            // Счет
            if (isPlaying && !isDead) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(score, width / 2, 60);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame(e) {
            if(e) e.preventDefault();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            resize();
            score = 0;
            cameraY = 0;
            isPlaying = true;
            isDead = false;
            
            initPlayer();
            initPlatforms();
        }

        function gameOver() {
            isDead = true;
            isPlaying = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        }

        // Кнопки
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        startBtn.addEventListener('click', startGame);
        startBtn.addEventListener('touchstart', startGame, {passive: false});
        restartBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('touchstart', startGame, {passive: false});

        gameLoop();
    </script>
</body>
</html>
