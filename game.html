<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #050507; --border: rgba(255, 255, 255, 0.08); --white: #ffffff; --gray: #9a9aa3; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--white); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; overflow: hidden; }
        .box { border: 1px solid var(--border); background: rgba(255, 255, 255, 0.02); padding: 40px 20px; border-radius: 16px; width: 100%; max-width: 350px; }
        h1 { font-size: 24px; margin-bottom: 15px; font-weight: 700; }
        p { color: var(--gray); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .icon { font-size: 50px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .btn { background: var(--white); color: var(--bg); border: none; padding: 15px 30px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🎮</div>
        <h1>Игра скоро появится</h1>
        <p>Здесь будет интерфейс игры. Напиши правила, и мы добавим логику!</p>
        <button class="btn" onclick="Telegram.WebApp.close()">Закрыть</button>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
