<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wall Kickers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050507;color:#ffffff;
font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;touch-action:manipulation}
canvas{display:block;width:100vw;height:100vh}

#hud{position:fixed;top:15px;left:15px;right:15px;
display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.panel{background:rgba(255, 255, 255, 0.04);padding:12px 16px;border-radius:12px;
border:1px solid rgba(255, 255, 255, 0.08);font-family:'Courier New',monospace;
font-size:15px;font-weight:700;color:#9a9aa3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel span { color: #ffffff; font-size: 17px; margin-left: 5px; }

#menu{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;background:rgba(5, 5, 7, 0.85);backdrop-filter:blur(5px);z-index:20}
.card{text-align:center;background:rgba(255, 255, 255, 0.03);padding:40px 30px;
border-radius:16px;width:min(90%,400px);border:1px solid rgba(255, 255, 255, 0.08);box-shadow:0 10px 40px rgba(0,0,0,0.5)}
h1{font-size:36px;margin:0 0 15px;font-weight:800;letter-spacing:-1px}
h1 span{color:#9a9aa3}
p{line-height:1.5;color:#9a9aa3;font-size:14px;margin-bottom:20px}
button{padding:16px 25px;border:0;border-radius:12px;
background:#ffffff;color:#050507;font-size:16px;
font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:transform 0.1s}
button:active{transform:scale(0.95)}
#help{position:fixed;bottom:15px;width:100%;text-align:center;
font-size:12px;color:#6b6b73;pointer-events:none;font-family:'Courier New',monospace;letter-spacing:1px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel">ВЫСОТА: <span id="height">0</span> М</div>
 <div class="panel">МОНЕТЫ: <span id="coins">0</span></div>
</div>

<div id="help">ТАП ПО ЭКРАНУ — ПРЫЖОК</div>

<div id="menu">
 <div class="card">
  <h1>WALL <span>KICKERS</span></h1>
  <p>Нажимай в любом месте экрана, чтобы прыгать от стены к стене. Поднимайся как можно выше!</p>
  <button id="start">НАЧАТЬ ИГРУ</button>
 </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W, H;
let player, steps, coins, score, camera, state;
let best=0, frame=0;
const WALL_WIDTH = 16;

// Исправленное определение размеров экрана для мобилок
function resize(){
    const rect = canvas.getBoundingClientRect();
    W = canvas.width = rect.width;
    H = canvas.height = rect.height;
}
window.addEventListener("resize", resize);
resize();

function reset(){
 // Ставим игрока на левую стену чуть выше низа
 player={
  x: WALL_WIDTH + 12,
  y: H - 150,
  vx: 0, vy: 0,
  side: -1, attached: true
 };
 steps=[];
 coins=[];
 score=0;
 camera=0;
 frame=0;

 // Генерируем первые платформы
 for(let i=0;i<20;i++) makeStep(H - i * 120);

 state="playing";
 document.getElementById("menu").style.display="none";
}

function makeStep(y){
 // Случайно выбираем сторону: -1 (левая) или 1 (правая)
 const side = Math.random() < 0.5 ? -1 : 1;
 const pWidth = 80;
 
 // Платформа привязывается либо к левой стене, либо к правой
 const pX = side === -1 ? WALL_WIDTH : W - WALL_WIDTH - pWidth;

 steps.push({
  x: pX,
  y: y,
  w: pWidth,
  h: 12,
  side: side
 });

 // Добавляем монету над платформой
 if(Math.random() < 0.6){
  coins.push({
   x: pX + pWidth/2,
   y: y - 50,
   taken: false
  });
 }
}

function jump(){
 if(state !== "playing" || !player.attached) return;

 // Прыгаем в противоположную сторону от текущей стены
 player.side *= -1; 
 player.vx = player.side * 5.5;
 player.vy = -12;
 player.attached = false;
 
 if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

// Обработчики
document.addEventListener("keydown",e=>{ if(e.code==="Space") jump(); });
canvas.addEventListener("pointerdown", jump);
document.getElementById("start").onclick=reset;

function gameOver(){
 state="over";
 best=Math.max(best, Math.floor((H-player.y+camera)/10));

 document.getElementById("menu").style.display="flex";
 document.querySelector(".card").innerHTML=`
 <h1 style="color:#ffffff">ИГРА <span style="color:#ff4444">ОКОНЧЕНА</span></h1>
 <p style="color:#9a9aa3">Высота: <b style="color:#fff">${Math.max(0,Math.floor((H-player.y+camera)/10))} м</b></p>
 <p style="color:#9a9aa3">Монет собрано: <b style="color:#fff">${score}</b></p>
 <p style="color:#9a9aa3">Рекорд: <b style="color:#fff">${best} м</b></p>
 <button onclick="reset()">ИГРАТЬ СНОВА</button>`;
 
 if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
}

function update(){
 if(state !== "playing") return;
 frame++;

 if(!player.attached){
  player.vy += 0.4; // Гравитация
  player.x += player.vx;
  player.y += player.vy;

  let landed = false;

  // 1. ПРИЗЕМЛЕНИЕ НА ПЛАТФОРМЫ
  if(player.vy > 0){
      for(const s of steps){
          // Если куб по X пересекается с платформой
          if(player.x + 12 > s.x && player.x - 12 < s.x + s.w){
              // Если куб по Y касается платформы сверху
              if(player.y + 12 >= s.y && player.y + 12 - player.vy <= s.y + 5){
                  player.y = s.y - 12; 
                  player.vy = 0;
                  player.vx = 0;
                  player.attached = true;
                  // Определяем сторону платформы для следующего прыжка
                  player.side = (s.x < W/2) ? -1 : 1;
                  landed = true;
                  break;
              }
          }
      }
  }

  // 2. ПРИЗЕМЛЕНИЕ НА СТЕНЫ
  if(!landed && !player.attached){
      // Левая стена
      if(player.x - 12 <= WALL_WIDTH){
          player.x = WALL_WIDTH + 12;
          player.vx = 0; player.vy = 0;
          player.attached = true;
          player.side = -1;
      }
      // Правая стена
      if(player.x + 12 >= W - WALL_WIDTH){
          player.x = W - WALL_WIDTH - 12;
          player.vx = 0; player.vy = 0;
          player.attached = true;
          player.side = 1;
      }
  }
 }

 // КАМЕРА
 const target = player.y - H * 0.4;
 if(target < camera) camera += (target - camera) * 0.1;

 // ГЕНЕРАЦИЯ ПЛАТФОРМ
 if(steps.length > 0){
     let highest = Math.min(...steps.map(s=>s.y));
     while(highest > camera - 200){
      highest -= 120;
      makeStep(highest);
     }
 }

 // Удаление старых объектов
 steps = steps.filter(s => s.y < camera + H + 100);
 coins = coins.filter(c => c.y < camera + H + 100);

 // СБОР МОНЕТ
 for(const c of coins){
  if(!c.taken && Math.hypot(player.x-c.x, player.y-c.y) < 25){
   c.taken = true;
   score++;
  }
 }

 document.getElementById("coins").textContent = score;
 document.getElementById("height").textContent = Math.max(0, Math.floor((H - player.y + camera) / 10));

 if(player.y - camera > H + 40) gameOver();
}

function draw(){
 // Очистка фона
 ctx.fillStyle = "#050507";
 ctx.fillRect(0, 0, W, H);

 // Звёзды
 ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
 for(let i=0; i<45; i++){
  const x = (i * 137) % W;
  const y = ((i * 83 - camera * 0.2) % H + H) % H;
  ctx.fillRect(x, y, 2, 2);
 }

 // Стены (всегда по краям)
 ctx.fillStyle = "#1a1a1f";
 ctx.fillRect(0, 0, WALL_WIDTH, H);
 ctx.fillRect(W - WALL_WIDTH, 0, WALL_WIDTH, H);

 // Платформы
 for(const s of steps){
  const y = s.y - camera;
  if(y < -20 || y > H + 20) continue;

  ctx.fillStyle = "#2c2c2e";
  ctx.fillRect(s.x, y, s.w, s.h);

  // Светящаяся верхушка
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(s.x, y, s.w, 2);
 }

 // Монеты
 for(const c of coins){
  if(c.taken) continue;
  const y = c.y - camera;
  if(y < -20 || y > H + 20) continue;

  ctx.beginPath();
  ctx.arc(c.x, y, 7, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  ctx.strokeStyle = "#9a9aa3";
  ctx.lineWidth = 2;
  ctx.stroke();
 }

 // ИГРОК
 const px = player.x;
 const py = player.y - camera;

 ctx.shadowBlur = 15;
 ctx.shadowColor = '#ffffff';
 ctx.fillStyle = "#ffffff";
 ctx.fillRect(px - 12, py - 12, 24, 24);
 ctx.shadowBlur = 0;
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
