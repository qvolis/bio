
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wall Hopper</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101827;color:white;
font-family:Arial,sans-serif;touch-action:manipulation}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:15px;left:15px;right:15px;
display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#101827dd;padding:12px 16px;border-radius:12px;
border:1px solid #ffffff25;font-size:19px;font-weight:bold}
#menu{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;background:#07101acc}
.card{text-align:center;background:#172438;padding:30px;
border-radius:22px;width:min(90%,400px)}
h1{font-size:42px;margin:0 0 15px}
h1 span{color:#a3ff6f}
p{line-height:1.5;color:#c5d1e2}
button{padding:14px 25px;border:0;border-radius:12px;
background:#a3ff6f;color:#172438;font-size:17px;
font-weight:bold;cursor:pointer}
#help{position:fixed;bottom:15px;width:100%;text-align:center;
font-size:13px;color:#d5e1f0;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel">⬆ <span id="height">0</span> м</div>
 <div class="panel">🪙 <span id="coins">0</span></div>
</div>

<div id="help">← → или A / D — прыжок между стенами</div>

<div id="menu">
 <div class="card">
  <h1>WALL <span>HOPPER</span></h1>
  <p>Прыгай с одной стены на другую, собирай монеты
  и заберись как можно выше!</p>
  <button id="start">НАЧАТЬ ИГРУ</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,player,steps,coins,score,camera,state;
let best=0,frame=0;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function reset(){
 player={
  x:40,y:H-120,vx:0,vy:0,
  side:-1,attached:true
 };
 steps=[];
 coins=[];
 score=0;
 camera=0;
 frame=0;

 for(let i=0;i<20;i++)makeStep(H-30-i*110);

 state="playing";
 document.getElementById("menu").style.display="none";
}

function makeStep(y){
 const side=Math.random()<0.5?-1:1;
 steps.push({
  x:side===-1?0:W-75,
  y:y,w:75,h:12,side
 });

 if(Math.random()<0.7){
  coins.push({
   x:W*0.2+Math.random()*W*0.6,
   y:y-45,taken:false
  });
 }
}

function jump(dir){
 if(state!=="playing")return;

 player.side=dir;
 player.vx=dir*5.2;
 player.vy=-9.2;
 player.attached=false;
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
  jump(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
  jump(1);
 if(e.code==="Space"&&state!=="playing")reset();
});

canvas.addEventListener("pointerdown",e=>{
 jump(e.clientX<W/2?-1:1);
});

document.getElementById("start").onclick=reset;

function gameOver(){
 state="over";
 best=Math.max(best,Math.floor((H-player.y+camera)/10));

 document.getElementById("menu").style.display="flex";
 document.querySelector(".card").innerHTML=`
 <h1>ИГРА <span>ОКОНЧЕНА</span></h1>
 <p>Высота: ${Math.max(0,Math.floor((H-player.y+camera)/10))} м</p>
 <p>Монет собрано: ${score}</p>
 <p>Рекорд: ${best} м</p>
 <button onclick="reset()">ИГРАТЬ СНОВА</button>`;
}

function update(){
 if(state!=="playing")return;
 frame++;

 if(!player.attached){
  player.vy+=0.3;
  player.x+=player.vx;
  player.y+=player.vy;
  player.vx*=0.995;

  // Приземление на противоположную стену
  if(player.side===-1&&player.x<32){
   player.x=32;
   player.vx=0;
   player.vy=0;
   player.attached=true;
  }

  if(player.side===1&&player.x>W-32){
   player.x=W-32;
   player.vx=0;
   player.vy=0;
   player.attached=true;
  }
 }

 // Камера следует за игроком вверх
 const target=player.y-H*0.45;
 if(target<camera)camera+=(target-camera)*0.1;

 // Создание новых платформ
 let highest=Math.min(...steps.map(s=>s.y));
 while(highest>camera-200){
  highest-=110;
  makeStep(highest);
 }

 steps=steps.filter(s=>s.y<camera+H+100);
 coins=coins.filter(c=>c.y<camera+H+100);

 // Сбор монет
 for(const c of coins){
  if(!c.taken&&Math.hypot(player.x-c.x,player.y-c.y)<25){
   c.taken=true;
   score++;
  }
 }

 document.getElementById("coins").textContent=score;
 document.getElementById("height").textContent=
  Math.max(0,Math.floor((H-player.y+camera)/10));

 // Проигрыш при падении
 if(player.y-camera>H+40)gameOver();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 // Фон
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,"#101827");
 bg.addColorStop(1,"#1b3447");
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 // Звёзды
 ctx.fillStyle="#ffffff40";
 for(let i=0;i<45;i++){
  const x=(i*137)%W;
  const y=((i*83-camera*0.2)%H+H)%H;
  ctx.fillRect(x,y,2,2);
 }

 // Стены
 ctx.fillStyle="#293e53";
 ctx.fillRect(0,0,16,H);
 ctx.fillRect(W-16,0,16,H);

 // Платформы
 for(const s of steps){
  const y=s.y-camera;
  if(y<-20||y>H+20)continue;

  ctx.fillStyle="#405a70";
  ctx.fillRect(s.x,y,s.w,s.h);

  ctx.fillStyle="#a3ff6f";
  ctx.fillRect(s.x,y,s.w,3);
 }

 // Монеты
 for(const c of coins){
  if(c.taken)continue;
  const y=c.y-camera;
  if(y<-20||y>H+20)continue;

  ctx.beginPath();
  ctx.arc(c.x,y,7,0,Math.PI*2);
  ctx.fillStyle="#ffd34e";
  ctx.fill();

  ctx.strokeStyle="#fff1a6";
  ctx.lineWidth=2;
  ctx.stroke();
 }

 // Персонаж
 const x=player.x,y=player.y-camera;

 // Ноги
 ctx.strokeStyle="#b7f4ff";
 ctx.lineWidth=6;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(x-4,y+7);
 ctx.lineTo(x-9,y+16);
 ctx.moveTo(x+4,y+7);
 ctx.lineTo(x+9,y+16);
 ctx.stroke();

 // Тело
 ctx.fillStyle="#a3ff6f";
 ctx.beginPath();
 ctx.roundRect(x-10,y-8,20,22,6);
 ctx.fill();

 // Голова
 ctx.fillStyle="#f1c5a1";
 ctx.beginPath();
 ctx.arc(x,y-15,10,0,Math.PI*2);
 ctx.fill();

 // Волосы
 ctx.fillStyle="#263447";
 ctx.beginPath();
 ctx.arc(x,y-18,10,Math.PI,Math.PI*2);
 ctx.fill();

 // Глаз
 ctx.fillStyle="#172438";
 ctx.fillRect(x+(player.side===-1?-5:2),y-15,3,2);

 // Шарф
 ctx.fillStyle="#69d8ff";
 ctx.beginPath();
 ctx.moveTo(x-5,y-5);
 ctx.lineTo(x-17,y);
 ctx.lineTo(x-10,y+4);
 ctx.fill();
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
