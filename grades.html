<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Журнал Оценок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #050507;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.25);
            --white: #ffffff;
            --gray-300: #9a9aa3;
            --gray-400: #6b6b73;
            --mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--white);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Красивый фон */
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 70%);
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--gray-400);
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* ==================== ПАНЕЛЬ ИТОГОВ (СВЕРХУ) ==================== */
        .dashboard {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        /* Свечение на фоне панели */
        .dashboard::before {
            content: '';
            position: absolute;
            top: -50px; left: -50px;
            width: 150px; height: 150px;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(50px);
            border-radius: 50%;
            pointer-events: none;
        }

        .overall-score-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .overall-label {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--gray-300);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .overall-score {
            font-family: var(--mono);
            font-size: 54px;
            font-weight: 800;
            line-height: 1;
            transition: color 0.4s, text-shadow 0.4s;
        }

        .summary-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 4px 0;
        }

        .summary-subject {
            color: var(--gray-300);
            flex: 1;
            padding-right: 15px;
            line-height: 1.3;
        }

        .summary-grade {
            font-family: var(--mono);
            font-size: 15px;
            font-weight: 700;
            transition: color 0.3s;
        }

        /* ==================== КАРТОЧКИ ПРЕДМЕТОВ ==================== */
        .subjects-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subject-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .subject-card:hover {
            border-color: var(--border-hover);
            background: var(--glass-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            gap: 15px;
        }

        .subject-name {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--white);
        }

        .subject-avg {
            font-family: var(--mono);
            font-size: 16px;
            font-weight: 800;
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: color 0.3s;
        }

        /* Список оценок */
        .grades-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            min-height: 28px;
        }

        .grade-badge {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .grade-badge::after {
            content: '×';
            font-size: 12px;
            color: var(--gray-400);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .grade-badge:hover {
            background: rgba(255, 50, 50, 0.2);
            border-color: rgba(255, 50, 50, 0.5);
            color: #ff6b6b;
        }

        .grade-badge:hover::after {
            opacity: 1;
            color: #ff6b6b;
        }

        /* Добавление оценки */
        .add-grade-row {
            display: flex;
            gap: 10px;
            position: relative;
        }

        .grade-input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--white);
            font-family: var(--mono);
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .grade-input:focus {
            border-color: var(--white);
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        .grade-input::placeholder {
            color: var(--gray-400);
        }

        /* Убираем стрелочки у input type=number */
        .grade-input::-webkit-outer-spin-button,
        .grade-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .add-btn {
            background: var(--white);
            color: var(--bg);
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: 800;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        .add-btn:hover {
            background: #e0e0e0;
        }

        /* Кнопка закрытия */
        .close-btn {
            background: transparent;
            color: var(--gray-400);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 12px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 40px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            border-color: var(--white);
            color: var(--white);
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">// ЖУРНАЛ ОЦЕНОК</div>

        <!-- ПАНЕЛЬ ИТОГОВ (СВЕРХУ) -->
        <div class="dashboard">
            <div class="overall-score-container">
                <div class="overall-label">ОБЩИЙ СРЕДНИЙ БАЛЛ</div>
                <div class="overall-score" id="overall-score">—</div>
            </div>
            <div class="summary-list" id="summary-list">
                <!-- Строки с предметами и их средним баллом -->
            </div>
        </div>

        <!-- СПИСОК ПРЕДМЕТОВ -->
        <div class="subjects-container" id="subjects-container">
            <!-- Карточки предметов будут здесь -->
        </div>

        <button class="close-btn" onclick="Telegram.WebApp.close()">ЗАКРЫТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // --- СПИСОК ПРЕДМЕТОВ ---
        const defaultSubjects = [
            "Медицинская генетика",
            "Латинский язык",
            "Защита населения и территории от ЧС",
            "Гигиена и Экология человека",
            "СД и МТ",
            "Анатомия",
            "Физкультура",
            "Фармакология",
            "Основы права",
            "История медицины",
            "Гигиена"
        ];
        
        // Загружаем данные
        let gradesData = JSON.parse(localStorage.getItem('qvolis_grades')) || {};
        
        // Добавляем новые предметы, сохраняя старые оценки
        defaultSubjects.forEach(sub => {
            if (!gradesData[sub]) gradesData[sub] = [];
        });

        const container = document.getElementById('subjects-container');
        const summaryList = document.getElementById('summary-list');
        const overallScoreElement = document.getElementById('overall-score');

        // Функция цвета (от красного к зеленому)
        function getColorForGrade(avg) {
            if (avg === 0) return 'var(--gray-400)';
            const hue = (avg / 10) * 120; 
            return `hsl(${hue}, 80%, 60%)`;
        }

        // Отрисовка интерфейса
        function render() {
            container.innerHTML = '';
            summaryList.innerHTML = '';

            let totalSum = 0;
            let totalCount = 0;

            // Проходимся по всем предметам
            for (const subject in gradesData) {
                const grades = gradesData[subject];
                
                // Считаем среднее для предмета
                let avg = 0;
                if (grades.length > 0) {
                    const sum = grades.reduce((a, b) => a + b, 0);
                    avg = sum / grades.length;
                    totalSum += sum;
                    totalCount += grades.length;
                }

                // 1. КАРТОЧКА ПРЕДМЕТА
                const card = document.createElement('div');
                card.className = 'subject-card';
                
                // Бейджи с оценками (при клике удаляются)
                let gradesHtml = grades.map((g, index) => 
                    `<div class="grade-badge" onclick="removeGrade('${subject}', ${index})" title="Удалить оценку">${g}</div>`
                ).join('');

                card.innerHTML = `
                    <div class="subject-header">
                        <div class="subject-name">${subject}</div>
                        <div class="subject-avg" style="color: ${getColorForGrade(avg)}">
                            ${avg > 0 ? avg.toFixed(2) : '—'}
                        </div>
                    </div>
                    <div class="grades-list">${gradesHtml || '<span style="color:var(--gray-400); font-size:12px;">Нет оценок</span>'}</div>
                    <div class="add-grade-row">
                        <input type="number" class="grade-input" id="input-${subject}" placeholder="Оценка (1-10)" min="1" max="10" step="0.1">
                        <button class="add-btn" onclick="addGrade('${subject}')">+</button>
                    </div>
                `;
                container.appendChild(card);

                // 2. СТРОКА В ПАНЕЛИ СВЕРХУ
                const summaryRow = document.createElement('div');
                summaryRow.className = 'summary-row';
                summaryRow.innerHTML = `
                    <span class="summary-subject">${subject}</span>
                    <span class="summary-grade" style="color: ${getColorForGrade(avg)}">
                        ${avg > 0 ? avg.toFixed(2) : '—'}
                    </span>
                `;
                summaryList.appendChild(summaryRow);

                // Enter для ввода
                setTimeout(() => {
                    const input = document.getElementById(`input-${subject}`);
                    if(input) {
                        input.addEventListener('keypress', function (e) {
                            if (e.key === 'Enter') addGrade(subject);
                        });
                    }
                }, 0);
            }

            // 3. ОБЩИЙ СРЕДНИЙ БАЛЛ
            if (totalCount > 0) {
                const overallAvg = totalSum / totalCount;
                overallScoreElement.textContent = overallAvg.toFixed(2);
                overallScoreElement.style.color = getColorForGrade(overallAvg);
                overallScoreElement.style.textShadow = `0 0 30px ${getColorForGrade(overallAvg)}`;
            } else {
                overallScoreElement.textContent = '—';
                overallScoreElement.style.color = 'var(--gray-400)';
                overallScoreElement.style.textShadow = 'none';
            }

            // Сохраняем
            localStorage.setItem('qvolis_grades', JSON.stringify(gradesData));
        }

        // Добавление оценки
        function addGrade(subject) {
            const input = document.getElementById(`input-${subject}`);
            const value = parseFloat(input.value);

            if (value >= 1 && value <= 10) {
                gradesData[subject].push(value);
                input.value = '';
                render();
            } else {
                input.value = '';
                input.placeholder = 'От 1 до 10!';
                input.style.borderColor = '#ff4444';
                setTimeout(() => {
                    input.placeholder = 'Оценка (1-10)';
                    input.style.borderColor = 'var(--border)';
                }, 1500);
            }
        }

        // Удаление оценки
        function removeGrade(subject, index) {
            gradesData[subject].splice(index, 1);
            render();
        }

        // Запуск
        render();
    </script>
</body>
</html>
